$kind: http-request
name: Invalid Token - Protected Endpoint
order: 2000
url: '{{base_url}}/api/products'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: 'not-a-valid-jwt'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("Returns 401", () => pm.response.to.have.status(401));
      pm.test("Returns the standard error shape", () => {
          pm.expect(body.message).to.be.a("string").and.not.empty;
          pm.expect(body.code).to.be.a("string").and.not.empty;
      });
      pm.test("Rejects the invalid token", () => {
          pm.expect(body.message).to.eql("Not authorised");
          pm.expect(body.code).to.eql("UNAUTHORIZED");
      });
